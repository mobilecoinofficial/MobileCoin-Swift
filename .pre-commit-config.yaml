repos:
  - repo: local
    hooks:
      - id: autocorrect
        name: autocorrect
        entry: "ExampleHTTP/Pods/SwiftLint/swiftlint --fix --force-exclude"
        language: script
        files: \.swift$
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: "ExampleHTTP/Pods/SwiftLint/swiftlint --strict --quiet --force-exclude"
        language: script
        files: \.swift$
