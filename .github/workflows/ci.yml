name: ci

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor for every job; publish-pod-release raises its own.
permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  # cocoapods-keys resolves these from the environment before consulting the
  # keychain, so exporting them here is enough for `pod install`.
  devNetworkAuthUsername: ${{ secrets.DEV_NETWORK_AUTH_USERNAME }}
  devNetworkAuthPassword: ${{ secrets.DEV_NETWORK_AUTH_PASSWORD }}
  testNetTestAccountMnemonicsCommaSeparated: ${{ secrets.TESTNET_TEST_ACCOUNT_MNEMONICS_COMMA_SEPARATED }}
  mobileDevTestAccountMnemonicsCommaSeparated: ${{ secrets.MOBILEDEV_TEST_ACCOUNT_MNEMONICS_COMMA_SEPARATED }}
  dynamicTestAccountSeedEntropiesCommaSeparated: ${{ secrets.DYNAMIC_TEST_ACCOUNT_ENTROPIES_COMMA_SEPARATED }}
  dynamicFogAuthoritySpki: ${{ secrets.DYNAMIC_FOG_AUTHORITY_SPKI }}

jobs:

  build-and-test-example-http:
    name: Example app integration tests
    runs-on: macos-26
    timeout-minutes: 120
    env:
      FL_BUILDLOG_PATH: ../output/buildlogs
      SCAN_OUTPUT_DIRECTORY: ../output/scan
      SCAN_OUTPUT_TYPES: junit
      # Pinned with an explicit OS version: a versionless name sends fastlane
      # 2.225 through scan's default_os_version lookup, which crashes on
      # Xcode 26 (fixed upstream, but cocoapods-binary's xcpretty pin caps
      # fastlane below the fix). Update it when the image rotates simulators.
      IOS_SIM_DEVICE: "iPhone 17 (26.5)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup-macos-ci

      - name: Build
        run: make build-example-http

      - name: Test
        run: make test-example-http

      # `output` holds gym's buildlogs (FL_BUILDLOG_PATH) and scan's junit
      # (SCAN_OUTPUT_DIRECTORY); scan writes its raw xcodebuild logs to
      # ~/Library/Logs/scan instead, which is where per-target build details
      # (archs, module paths) live when a compile fails.
      - name: Upload build and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-http-output
          path: |
            output
            ~/Library/Logs/scan
          if-no-files-found: ignore

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-http-diagnostics
          path: ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore

  # Deliberately does NOT use ./.github/actions/setup-macos-ci: no submodules, no
  # LFS, no Ruby, no CocoaPods. That is the point — SPM resolves libmobilecoin
  # (and its nested LFS-tracked Artifacts submodule) from GitHub on its own, and
  # this job is what proves the SPM consumption path stands up without any of the
  # CocoaPods toolchain. `swift test` is not run here: MobileCoinTests needs
  # Tests/Common/Secrets/secrets.json, which today is produced by a script that
  # reads an `age` identity out of the macOS login keychain.
  build-spm:
    name: Swift package build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$xcode_app" ]]; then
            echo "::error::No Xcode 26.x found on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "$GITHUB_ENV"

      # Not cached on purpose. `.build` came to 5.2 GB — 94% of the repository's
      # 10 GB Actions cache budget — because SwiftPM keeps a bare clone *and* a
      # checkout of libmobilecoin, whose LFS artifacts are ~330 MB on their own.
      # Every Package.resolved change would mint another 5 GB entry and evict the
      # small gem and Pods caches the slower jobs depend on. A cold build is
      # ~8 minutes against ~3 warm; that is a cheap trade on the fastest job here.
      - name: Build
        run: make build-spm

      # SwiftPM clones libmobilecoin itself; if git-lfs smudging doesn't happen
      # in that clone the .a files arrive as pointer text and the failure shows
      # up much later as an unrelated linker error.
      - name: Verify SwiftPM resolved the LFS binaries
        run: |
          set -euo pipefail
          lib=".build/checkouts/libmobilecoin/Artifacts/LibMobileCoinLibrary.xcframework"
          if [[ ! -d "$lib" ]]; then
            echo "::error::$lib is missing from the SwiftPM checkout."
            exit 1
          fi
          count=0
          while IFS= read -r archive; do
            if head -c 100 "$archive" | grep -q 'git-lfs.github.com'; then
              echo "::error::$archive is an unresolved Git LFS pointer."
              exit 1
            fi
            echo "ok: $archive ($(du -h "$archive" | cut -f1))"
            count=$((count + 1))
          done < <(find "$lib" -name '*.a')
          # Without this the check passes vacuously if the xcframework layout
          # ever changes and `find` matches nothing.
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Found no .a archives under $lib."
            exit 1
          fi

      # `swift build` rewrites Package.resolved if the declared dependencies and
      # the committed resolution disagree. Adding swift-log explicitly should not
      # move anything, since grpc-swift was already pulling it in.
      - name: Check for uncommitted changes
        run: ./scripts/check_dirty_git

  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup-macos-ci

      # `make lint-strict` runs the SwiftLint binary vendored into
      # ExampleHTTP/Pods, which is why this job still needs `pod install`.
      - name: Lint
        run: make lint-strict

      - name: Check for uncommitted changes
        run: ./scripts/check_dirty_git

  # Non-blocking: CocoaPods distribution is deprecated in favour of SPM, and
  # neither linkage mode passes. Dynamic dies on libarclite (Logging 1.4.0
  # declares iOS 8.0); --use-static-frameworks fails the lint App's link because
  # LibMobileCoin injects its vendored .a via pod_target_xcconfig OTHER_LDFLAGS,
  # which does not propagate out of a static framework. Verified on Xcode 26.6.
  pod-lib-lint:
    name: CocoaPods podspec lint
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 120
    env:
      FL_BUILDLOG_PATH: ../output/buildlogs
      SCAN_OUTPUT_DIRECTORY: ../output/scan
      SCAN_OUTPUT_TYPES: junit
      # This job is diagnostic-only now, and CocoaPods' summarised output hides
      # the undefined symbols behind a bare "linker command failed".
      POD_LINT_EXTRA_FLAGS: --verbose
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup-macos-ci

      - name: Lint podspec
        run: make lint-locally-strict-podspec

      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-lib-lint-output
          path: output
          if-no-files-found: ignore

      - name: Check for uncommitted changes
        run: ./scripts/check_dirty_git

  publish-pod-release:
    name: Publish pod release
    # pod-lib-lint is deliberately not a gate here: it is continue-on-error, and
    # a `needs` on it would still block this job when it fails.
    needs: [build-and-test-example-http, swiftlint]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          # `make tag-release` pushes a tag using the checkout credentials.
          fetch-depth: 0
          persist-credentials: true

      - name: Setup
        uses: ./.github/actions/setup-macos-ci

      # CircleCI ran this job on every master push, so it failed noisily on any
      # commit that didn't bump the podspec version. Skip instead. Trunk is the
      # source of truth here: checking only the git tag would skip the publish
      # forever after a run that pushed the tag and then failed before the
      # trunk push landed.
      - name: Check whether this version is already released
        id: version
        run: |
          set -euo pipefail
          version="$(bundle exec pod ipc spec MobileCoin.podspec | jq -r '.version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if bundle exec pod trunk info MobileCoin | grep -qF -- "- ${version} ("; then
            echo "Version ${version} is already on trunk; nothing to publish."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set git credentials
        if: steps.version.outputs.should-publish == 'true'
        run: |
          git config user.email "mobilecoin-ci@mobilecoin.com"
          git config user.name "mobilecoin-ci"

      # The podspec's source is `:tag => "v#{s.version}"`, so the tag must
      # exist before the trunk push. Kept idempotent so a rerun after a failed
      # trunk push does not die on the already-pushed tag.
      - name: Tag release
        if: steps.version.outputs.should-publish == 'true'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists; skipping tag push."
          else
            make tag-release
          fi

      - name: Publish pod to trunk
        if: steps.version.outputs.should-publish == 'true'
        run: make publish-podspec
