name: ci

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor for every job.
permissions:
  contents: read

jobs:

  # `swift test` compiles every target in the package, the skipped suites
  # included, so a target that cannot compile fails here even when it never runs.
  swift-test:
    name: Swift package tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap and first, so a broken secret lookup fails before the build.
      - name: Check the secret lookup helper
        run: tools/lookup_test.sh

      # No `.build` cache on purpose. The entry would be the whole build tree,
      # which is large against this repo's cache budget.
      - name: Test
        run: make test-spm

      # `swift test` builds for the host. The only consumer of this SDK is an
      # iOS app, so the iOS slice needs its own compile.
      - name: Build for iOS
        run: make build-ios

      # The build rewrites Package.resolved when the declared dependencies and
      # the committed resolution disagree. The two fixtures the recipe seeds
      # are ignored, so they must not show up here either.
      - name: Check for uncommitted changes
        run: ./scripts/check_dirty_git

  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `tools/swiftlint.sh` downloads its own pinned binary, so this job needs
      # no toolchain of its own.
      - name: Lint
        run: make lint-strict

      - name: Check for uncommitted changes
        run: ./scripts/check_dirty_git
